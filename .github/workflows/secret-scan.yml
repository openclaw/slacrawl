name: "Security Gate: Secret Scanning"

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

permissions: {}

jobs:
  trufflehog:
    name: Scan for Verified Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve scan range
        id: scan_range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          zero_sha="0000000000000000000000000000000000000000"

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
            head="$PR_HEAD_SHA"
          else
            base="$PUSH_BASE_SHA"
            head="$PUSH_HEAD_SHA"
            if [[ -z "$base" || "$base" == "$zero_sha" ]]; then
              base="origin/$DEFAULT_BRANCH"
            fi
          fi

          {
            echo "base<<EOF"
            printf '%s\n' "$base"
            echo "EOF"
            echo "head<<EOF"
            printf '%s\n' "$head"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          base: ${{ steps.scan_range.outputs.base }}
          head: ${{ steps.scan_range.outputs.head }}
          extra_args: --only-verified --debug

      - name: Notify on failure
        if: steps.trufflehog.outcome == 'failure'
        run: |
          echo "::error::Verified secrets found. Rotate the credential before merging."
          exit 1
